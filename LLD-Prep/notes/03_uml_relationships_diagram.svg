<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 610" font-family="ui-monospace, SF Mono, Consolas, monospace">
  <defs>
    <marker id="triHollow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M2,2 L18,10 L2,18 Z" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
    </marker>
    <marker id="openArrow" viewBox="0 0 20 20" refX="16" refY="10" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M2,2 L18,10 L2,18" fill="none" stroke="#334155" stroke-width="1.8"/>
    </marker>
    <marker id="diamondFilled" viewBox="0 0 20 20" refX="10" refY="10" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M10,2 L18,10 L10,18 L2,10 Z" fill="#334155" stroke="#334155"/>
    </marker>
    <marker id="diamondHollow" viewBox="0 0 20 20" refX="10" refY="10" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M10,2 L18,10 L10,18 L2,10 Z" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="740" height="610" fill="#ffffff"/>

  <text x="370" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a" font-family="-apple-system, Segoe UI, sans-serif">
    UML Relationships — weakest → strongest coupling
  </text>
  <text x="370" y="52" text-anchor="middle" font-size="12" fill="#64748b" font-family="-apple-system, Segoe UI, sans-serif">
    same six examples as the lesson's text-shorthand block, drawn out
  </text>

  <!-- Row 1: Dependency — OrderService ..&gt; Logger -->
  <g>
    <rect x="30" y="80" width="150" height="50" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
    <text x="105" y="110" text-anchor="middle" font-size="13" fill="#0f172a">OrderService</text>
    <rect x="540" y="80" width="150" height="50" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
    <text x="615" y="110" text-anchor="middle" font-size="13" fill="#0f172a">Logger</text>
    <line x1="180" y1="105" x2="536" y2="105" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
    <text x="360" y="87" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2563eb" font-family="-apple-system, Segoe UI, sans-serif">Dependency</text>
    <text x="360" y="122" text-anchor="middle" font-size="11.5" fill="#64748b">OrderService ..&gt; Logger</text>
  </g>

  <!-- Row 2: Association: Driver to Trip -->
  <g>
    <rect x="30" y="170" width="150" height="50" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
    <text x="105" y="200" text-anchor="middle" font-size="13" fill="#0f172a">Driver</text>
    <rect x="540" y="170" width="150" height="50" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
    <text x="615" y="200" text-anchor="middle" font-size="13" fill="#0f172a">Trip</text>
    <line x1="180" y1="195" x2="540" y2="195" stroke="#334155" stroke-width="1.5"/>
    <text x="192" y="188" font-size="11" fill="#0f172a">1</text>
    <text x="518" y="188" font-size="11" fill="#0f172a">*</text>
    <text x="360" y="177" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2563eb" font-family="-apple-system, Segoe UI, sans-serif">Association</text>
    <text x="360" y="212" text-anchor="middle" font-size="11.5" fill="#64748b">Driver "1" -- "*" Trip</text>
  </g>

  <!-- Row 3: Aggregation: Team to Player -->
  <g>
    <rect x="30" y="260" width="150" height="50" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
    <text x="105" y="290" text-anchor="middle" font-size="13" fill="#0f172a">Team</text>
    <rect x="540" y="260" width="150" height="50" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
    <text x="615" y="290" text-anchor="middle" font-size="13" fill="#0f172a">Player</text>
    <line x1="180" y1="285" x2="540" y2="285" stroke="#334155" stroke-width="1.5" marker-start="url(#diamondHollow)"/>
    <text x="196" y="278" font-size="11" fill="#0f172a">1</text>
    <text x="518" y="278" font-size="11" fill="#0f172a">*</text>
    <text x="360" y="267" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2563eb" font-family="-apple-system, Segoe UI, sans-serif">Aggregation — hollow ◇ (weak, part survives)</text>
    <text x="360" y="302" text-anchor="middle" font-size="11.5" fill="#64748b">Team "1" o-- "*" Player</text>
  </g>

  <!-- Row 4: Composition: ParkingLot to ParkingSpot -->
  <g>
    <rect x="20" y="350" width="160" height="50" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
    <text x="100" y="380" text-anchor="middle" font-size="12.5" fill="#0f172a">ParkingLot</text>
    <rect x="530" y="350" width="160" height="50" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
    <text x="610" y="380" text-anchor="middle" font-size="12.5" fill="#0f172a">ParkingSpot</text>
    <line x1="180" y1="375" x2="530" y2="375" stroke="#334155" stroke-width="1.5" marker-start="url(#diamondFilled)"/>
    <text x="196" y="368" font-size="11" fill="#0f172a">1</text>
    <text x="508" y="368" font-size="11" fill="#0f172a">*</text>
    <text x="360" y="357" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2563eb" font-family="-apple-system, Segoe UI, sans-serif">Composition — filled ◆ (strong, part dies with it)</text>
    <text x="360" y="392" text-anchor="middle" font-size="11.5" fill="#64748b">ParkingLot "1" *-- "*" ParkingSpot</text>
  </g>

  <!-- Row 5: Realization — Car ..|&gt; Drivable -->
  <g>
    <rect x="30" y="440" width="150" height="50" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
    <text x="105" y="470" text-anchor="middle" font-size="13" fill="#0f172a">Car</text>
    <rect x="540" y="440" width="150" height="50" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
    <text x="615" y="461" text-anchor="middle" font-size="10" fill="#64748b">«interface»</text>
    <text x="615" y="478" text-anchor="middle" font-size="13" fill="#0f172a">Drivable</text>
    <line x1="180" y1="465" x2="536" y2="465" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#triHollow)"/>
    <text x="360" y="447" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2563eb" font-family="-apple-system, Segoe UI, sans-serif">Realization (implements)</text>
    <text x="360" y="482" text-anchor="middle" font-size="11.5" fill="#64748b">Car ..|&gt; Drivable</text>
  </g>

  <!-- Row 6: Inheritance: Car extends Vehicle -->
  <g>
    <rect x="30" y="530" width="150" height="50" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
    <text x="105" y="560" text-anchor="middle" font-size="13" fill="#0f172a">Car</text>
    <rect x="540" y="530" width="150" height="50" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
    <text x="615" y="560" text-anchor="middle" font-size="13" fill="#0f172a">Vehicle</text>
    <line x1="180" y1="555" x2="536" y2="555" stroke="#334155" stroke-width="1.5" marker-end="url(#triHollow)"/>
    <text x="360" y="537" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2563eb" font-family="-apple-system, Segoe UI, sans-serif">Inheritance (extends) — strongest</text>
    <text x="360" y="572" text-anchor="middle" font-size="11.5" fill="#64748b">Car --|&gt; Vehicle</text>
  </g>
</svg>
